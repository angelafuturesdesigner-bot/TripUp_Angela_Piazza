<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TripUp">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="TripUp – plan, vote and split costs with your group. Interactive prototype.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <title>TripUp – interactive prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <aside class="intro">
      <h1 class="intro__title">TripUp – interactive prototype</h1>
      <p class="intro__text">Follow Ari's last evening in Lisbon: pick dinner with the group, split the bill, settle up.</p>
      <button class="btn btn--secondary" data-action="restart">Restart demo</button>
    </aside>

    <div class="device" id="device">
      <div class="statusbar" aria-hidden="true">
        <span class="statusbar__time">18:30</span>
        <span class="statusbar__icons">
          <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5.2" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10.4" y="3" width="3.2" height="9" rx="1"/><rect x="15.6" y="0" width="3.2" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.6c2.4 0 4.6.9 6.2 2.5l1.2-1.2A10.4 10.4 0 0 0 8.5.9 10.4 10.4 0 0 0 1.1 3.9l1.2 1.2a8.7 8.7 0 0 1 6.2-2.5Zm0 3.5c1.4 0 2.8.6 3.8 1.5l1.2-1.2a7.1 7.1 0 0 0-10 0l1.2 1.2c1-1 2.4-1.5 3.8-1.5Zm0 3.4c-.5 0-1 .2-1.4.6L8.5 12l1.4-1.9c-.4-.4-.9-.6-1.4-.6Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" stroke="currentColor" opacity=".35"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".4"/></svg>
        </span>
      </div>

      <div class="layers" id="layers"></div>
      <div id="nav-host"></div>
      <div class="toast-host" id="toast-host"></div>
      <div id="push-host"></div>
      <div id="overlay-host"></div>
      <button class="restart-pill" id="restart-pill" data-action="restart"><span class="icon icon--20" aria-hidden="true">restart_alt</span>Restart demo</button>
      <span class="measure" id="measure"></span>

      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    // Desktop: keep iPhone 16 size (393×852), scale down only if the window is too short.
    (function () {
      var d = document.getElementById('device');
      function fit() {
        if (window.innerWidth <= 600) { d.style.transform = ''; d.style.margin = ''; return; }
        var s = Math.min(1, (window.innerHeight - 48) / 872);
        d.style.transform = s < 1 ? 'scale(' + s + ')' : '';
        d.style.margin = s < 1 ? (-(1 - s) * 852 / 2) + 'px 0' : '';
      }
      window.addEventListener('resize', fit); fit();
    })();
  </script>
  <script>
    // ---- Mobile helpers (no effect on desktop) ----
    (function () {
      var isPhone = function () { return window.innerWidth <= 600; };

      // 1. First tap goes full screen (Android/Chrome). iOS ignores this silently.
      function goFullscreen() {
        if (!isPhone() || document.fullscreenElement) return;
        var el = document.documentElement;
        if (el.requestFullscreen) { el.requestFullscreen().catch(function () {}); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
      }
      ['pointerup', 'touchend', 'click'].forEach(function (e) {
        document.addEventListener(e, goFullscreen, true);
      });

      // 2. Show the mock status bar only when the browser bar is gone,
      //    so the two never stack and push the titles off screen.
      function syncChrome() {
        var standalone = window.matchMedia('(display-mode: standalone)').matches
          || window.matchMedia('(display-mode: fullscreen)').matches
          || window.navigator.standalone === true
          || !!document.fullscreenElement;
        document.body.classList.toggle('is-fullscreen', standalone);
      }
      document.addEventListener('fullscreenchange', syncChrome);
      document.addEventListener('webkitfullscreenchange', syncChrome);
      window.addEventListener('resize', syncChrome);
      syncChrome();

      // 3. Keyboard: measure how much it covers and expose it as --kb,
      //    so bottom sheets and pickers stay above it.
      var vv = window.visualViewport;
      if (vv) {
        var applyKb = function () {
          var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
          var open = isPhone() && kb > 120;
          document.body.classList.toggle('kb-open', open);
          document.body.style.setProperty('--kb', (open ? kb : 0) + 'px');
        };
        vv.addEventListener('resize', applyKb);
        vv.addEventListener('scroll', applyKb);
      }

      // 4. Keep the focused field in view once the keyboard has settled.
      document.addEventListener('focusin', function (e) {
        if (!isPhone()) return;
        var t = e.target;
        if (!t.matches || !t.matches('input, textarea')) return;
        setTimeout(function () {
          t.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 300);
      });
    })();
  </script>
</body>
</html>
